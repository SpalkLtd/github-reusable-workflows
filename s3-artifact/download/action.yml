# Downloads artifacts written by s3-artifact/upload earlier in the same
# workflow run. See s3-artifact/upload for the layout and the credential model;
# this step assumes the same role the same way and keeps the credentials in its
# own shell.
#
#   uses: SpalkLtd/github-reusable-workflows/s3-artifact/download@<sha>
#
# SELECTION follows actions/download-artifact: `name` fetches one artifact
# (missing = error); otherwise `pattern` (a shell glob, default *) fetches
# every match (none = warning). A single artifact extracts into `path`;
# several extract into `path/<name>/` unless merge-multiple is true.
#
# Attempts up to the current one are searched and the newest wins per name,
# so a re-run job reads what its earlier attempt produced. Later attempts
# cannot exist yet for this run, so anything claiming to be one is ignored.
#
# Archives holding anything other than regular files and directories are
# refused: a symlink would otherwise survive extraction and let a later
# `aws s3 cp --recursive` or similar follow it out of the destination.
name: Download artifact from S3
description: Download same-run artifacts stored in S3 by s3-artifact/upload, assuming the artifact IAM role via OIDC.

inputs:
  name:
    description: Artifact to download. Mutually exclusive with pattern.
    required: false
    default: ''
  pattern:
    description: Shell glob matching artifact names to download when name is unset.
    required: false
    default: ''
  path:
    description: Destination directory.
    required: false
    default: ${{ github.workspace }}
  merge-multiple:
    description: Extract every matched artifact into `path` itself instead of per-name subdirectories.
    required: false
    default: 'false'
  role-to-assume:
    description: IAM role assumed by runs on any ref other than refs/heads/main.
    required: false
    default: arn:aws:iam::496668274218:role/dev_bifrost_gha_artifacts_role_mr
  main-role-to-assume:
    description: IAM role assumed by runs on refs/heads/main.
    required: false
    default: arn:aws:iam::496668274218:role/dev_bifrost_gha_artifacts_main_role_mr
  bucket:
    description: Artifact bucket.
    required: false
    default: spalk-bifrost-gha-artifacts
  aws-region:
    description: Region of the artifact bucket.
    required: false
    default: us-east-2

runs:
  using: composite
  steps:
    - name: Download artifact from S3
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        PATTERN: ${{ inputs.pattern }}
        DEST: ${{ inputs.path }}
        MERGE: ${{ inputs.merge-multiple }}
        ROLE: ${{ inputs.role-to-assume }}
        MAIN_ROLE: ${{ inputs.main-role-to-assume }}
        REF: ${{ github.ref }}
        BUCKET: ${{ inputs.bucket }}
        REGION: ${{ inputs.aws-region }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        err() { echo "::error::s3-artifact/download: $*"; exit 1; }

        [ -n "$NAME" ] && [ -n "$PATTERN" ] && err "set name or pattern, not both"
        if [ -n "$NAME" ]; then
          [[ "$NAME" =~ ^[A-Za-z0-9._-]+$ && "$NAME" != .* ]] || err "invalid name '$NAME'"
        fi

        # ------------------------------------------------------ credentials
        [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || err "no OIDC token available; grant the job 'id-token: write'"
        # -q first: it is positional, and without it curl honours ~/.curlrc.
        jwt=$(curl -q -fsSL --retry 3 --max-time 60 \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
        echo "::add-mask::$jwt"

        # A clean AWS environment: no inherited keys, profiles or config
        # files, so earlier steps cannot steer which identity this uses.
        unset "${!AWS_@}"
        export AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null
        export AWS_REGION="$REGION" AWS_DEFAULT_REGION="$REGION" AWS_EC2_METADATA_DISABLED=true

        [ "$REF" = "refs/heads/main" ] && ROLE="$MAIN_ROLE"
        creds=$(aws sts assume-role-with-web-identity --no-sign-request \
          --role-arn "$ROLE" --role-session-name "artifact-$RUN_ID-$RUN_ATTEMPT" \
          --web-identity-token "$jwt" --duration-seconds 3600 \
          --query Credentials --output json)
        AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<< "$creds")
        AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<< "$creds")
        AWS_SESSION_TOKEN=$(jq -r .SessionToken <<< "$creds")
        echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
        echo "::add-mask::$AWS_SESSION_TOKEN"
        export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
        unset creds jwt

        # ------------------------------------------------------------ list
        # Keys are <repo>/<ref>/<run_id>/<attempt>/<name>.tar. Captured before
        # looping: a failure inside <(...) would be invisible to set -e.
        prefix="$REPO/$REF/$RUN_ID/"
        keys=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$prefix" \
                 --query 'Contents[].Key' --output json | jq -r '.[]?')
        declare -A newest=()
        while IFS= read -r key; do
          [ -z "$key" ] && continue
          rest="${key#"$prefix"}"
          attempt="${rest%%/*}"; file="${rest#*/}"
          [[ "$attempt" =~ ^[0-9]+$ && "$attempt" -le "$RUN_ATTEMPT" && "$file" == *.tar && "$file" != */* ]] || continue
          n="${file%.tar}"
          [[ "$n" =~ ^[A-Za-z0-9._-]+$ && "$n" != .* ]] || continue
          if [ -z "${newest[$n]:-}" ] || [ "$attempt" -gt "${newest[$n]%%:*}" ]; then
            newest[$n]="$attempt:$key"
          fi
        done <<< "$keys"

        selected=()
        if [ -n "$NAME" ]; then
          [ -n "${newest[$NAME]:-}" ] || err "artifact '$NAME' not found for run $RUN_ID"
          selected=("$NAME")
        else
          glob="${PATTERN:-*}"
          for n in "${!newest[@]}"; do
            # Unquoted RHS on purpose: it is the user's glob.
            [[ "$n" == $glob ]] && selected+=("$n")
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "::warning::s3-artifact/download: no artifacts match the pattern for run $RUN_ID"
            exit 0
          fi
        fi

        # --------------------------------------------------------- extract
        # GNU tar strips leading '/' and '..' components from member names;
        # the type check below keeps links and devices out entirely.
        tarball="$(mktemp -p "${RUNNER_TEMP:-/tmp}")"
        trap 'rm -f "$tarball"' EXIT
        for n in "${selected[@]}"; do
          key="${newest[$n]#*:}"
          if [ "${#selected[@]}" -eq 1 ] || [ "$MERGE" = "true" ]; then out="$DEST"; else out="$DEST/$n"; fi
          aws s3 cp "s3://$BUCKET/$key" "$tarball" --only-show-errors
          bad=$(tar -tvf "$tarball" | cut -c1 | grep -cv '^[-d]$' || true)
          [ "$bad" -eq 0 ] || err "artifact '$n' contains $bad link or special-file entries; refusing to extract"
          mkdir -p "$out"
          tar -xf "$tarball" -C "$out" --no-same-owner
          echo "Downloaded artifact '$n' from s3://$BUCKET/$key to $out"
        done
