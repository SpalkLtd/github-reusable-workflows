# This workflow fetches a pre-built Lambda binary, verifies it against the build job's
# sha256, and deploys it to AWS Lambda.
# It does NOT check out caller repo code, does NOT have SSH keys, and does NOT execute
# any user code. This separation ensures that AWS credentials are never available during
# code execution.
#
# The workflow uploads the binary + config to S3, updates the Lambda function code,
# publishes a new version, and creates a version-specific alias. It can also
# create-or-update an optional moving alias (e.g. pr-42-head) pointing at that
# version. It does NOT update the 'current' alias — that is handled by
# activate-lambda.yml (dev) or manually (prod).
#
# It will require setting up correct IAM authorization, which is detailed in README.md.
name: Deploy Lambda

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for this job. Must be a RunsOn label with the s3-cache extra: the handoff fetch needs the RunsOn cache bucket.'
        required: false
        type: string
        default: "ubuntu-latest"
      aws-role:
        description: "AWS IAM role to assume via OIDC"
        required: true
        type: string
      aws-region:
        description: "AWS region for deployment"
        required: true
        type: string
      binary-key:
        description: "S3 key of the binary: build-lambda.yml's binary-key output, or a caller's own handoff under $RUNS_ON_S3_CACHE_REPO_PREFIX"
        required: true
        type: string
      binary-sha256:
        description: "sha256 of the binary (build-lambda.yml's binary-sha256 output); the fetched binary must match it"
        required: true
        type: string
      binary-name:
        description: "Name of the binary file"
        required: false
        type: string
        default: "main"
      function-name:
        description: "Lambda function name (e.g. dev_vod_processing_http_handler)"
        required: true
        type: string
      config-s3-path:
        description: "S3 URI for the config.json file (e.g. s3://spalk-configs/dev/us-east-2/vod-processing-service/lambda/config.json)"
        required: true
        type: string
      lambda-binaries-bucket:
        description: "S3 bucket for Lambda deployment ZIPs (e.g. dev-spalk-vod-processing-lambda-binaries)"
        required: true
        type: string
      alias-name:
        description: "Version-specific alias to create (e.g. sha-abc123 or v1-2-3). Must NOT be 'current'."
        required: true
        type: string
      moving-alias-name:
        description: "Optional moving alias to create-or-update to point at the just-published version (e.g. pr-42-head). Unlike alias-name it may already exist and is re-pointed. NOTE: this re-points whatever alias name is passed, so scope it carefully (e.g. per-PR) to limit blast radius. Must NOT be 'current'."
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "The published Lambda version number"
        value: ${{ jobs.deploy-lambda.outputs.version }}

jobs:
  deploy-lambda:
    name: Deploy Lambda
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - if: ${{ startsWith(inputs.runner, 'runs-on=') }}
        uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      # Copies exactly one object and checks it against the build job's hash
      # before anything reads it, and before this job holds its AWS role: a
      # tampered or missing object only fails here.
      - name: Fetch and verify binary
        env:
          KEY: ${{ inputs.binary-key }}
          EXPECTED: ${{ inputs.binary-sha256 }}
        run: |
          : "${RUNS_ON_S3_BUCKET_CACHE:?handoff needs a RunsOn runner with the s3-cache extra}"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::binary-sha256 is missing or not a sha256"; exit 1; }
          f="$RUNNER_TEMP/handoff"
          aws s3 cp --only-show-errors --region "$RUNS_ON_AWS_REGION" "s3://$RUNS_ON_S3_BUCKET_CACHE/$KEY" "$f"
          echo "$EXPECTED  $f" | sha256sum -c -
          mkdir -p /tmp/lambda-build
          mv "$f" "/tmp/lambda-build/${{ inputs.binary-name }}"

      - name: Sanitize and validate alias name
        id: alias
        env:
          MOVING_ALIAS_NAME: ${{ inputs.moving-alias-name }}
        run: |
          # Lambda alias names must match [a-zA-Z0-9-_]. Replace dots with hyphens
          # (e.g. v1.2.3 → v1-2-3) to support release tags as alias names.
          ALIAS=$(echo "${{ inputs.alias-name }}" | sed 's/\./-/g')
          if [[ "$ALIAS" == "current" ]]; then
            echo "::error::Refusing to create alias 'current'. Use activate-lambda.yml to update the live alias."
            exit 1
          fi
          echo "name=${ALIAS}" >> "$GITHUB_OUTPUT"

          # Optional moving alias (e.g. pr-42-head): create-or-updated below.
          MOVING=$(echo "$MOVING_ALIAS_NAME" | sed 's/\./-/g')
          if [[ "$MOVING" == "current" ]]; then
            echo "::error::Refusing to use moving alias 'current'. Use activate-lambda.yml to update the live alias."
            exit 1
          fi
          echo "moving_name=${MOVING}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.1.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}

      - name: Download config from S3
        run: |
          aws s3 cp "${{ inputs.config-s3-path }}" /tmp/lambda-build/config.json

      - name: Create deployment ZIP
        run: |
          cd /tmp/lambda-build
          chmod +x ${{ inputs.binary-name }}
          zip -j /tmp/lambda-deploy.zip ${{ inputs.binary-name }} config.json

      - name: Upload ZIP to S3
        env:
          BUCKET: ${{ inputs.lambda-binaries-bucket }}
          ALIAS: ${{ steps.alias.outputs.name }}
        run: |
          aws s3 cp /tmp/lambda-deploy.zip "s3://${BUCKET}/lambda_${ALIAS}.zip"

      - name: Update Lambda function code
        env:
          FUNCTION_NAME: ${{ inputs.function-name }}
          BUCKET: ${{ inputs.lambda-binaries-bucket }}
          ALIAS: ${{ steps.alias.outputs.name }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --s3-bucket "$BUCKET" \
            --s3-key "lambda_${ALIAS}.zip" \
            --region ${{ inputs.aws-region }} > /dev/null

      - name: Wait for function code update
        env:
          FUNCTION_NAME: ${{ inputs.function-name }}
        run: |
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region ${{ inputs.aws-region }}

      - name: Publish new version
        id: publish
        env:
          FUNCTION_NAME: ${{ inputs.function-name }}
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name "$FUNCTION_NAME" \
            --region ${{ inputs.aws-region }} \
            --output json | jq -r '.Version')
          echo "Published Lambda version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create version-specific alias
        env:
          FUNCTION_NAME: ${{ inputs.function-name }}
          ALIAS: ${{ steps.alias.outputs.name }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          echo "Creating alias '${ALIAS}' pointing to version ${VERSION}"
          aws lambda create-alias \
            --function-name "$FUNCTION_NAME" \
            --name "$ALIAS" \
            --function-version "$VERSION" \
            --region ${{ inputs.aws-region }} > /dev/null

      # A moving alias (e.g. pr-42-head) is re-pointed on every deploy, so it may
      # already exist. update-alias fails on the first deploy (alias absent), so
      # fall back to create-alias. Kept inside this credentialed, pinned workflow
      # so the IAM trust policy can be scoped to this workflow ref.
      - name: Create or update moving alias
        if: inputs.moving-alias-name != ''
        env:
          FUNCTION_NAME: ${{ inputs.function-name }}
          MOVING: ${{ steps.alias.outputs.moving_name }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          echo "Pointing moving alias '${MOVING}' at version ${VERSION}"
          # Capture update-alias stderr so a real failure (throttle, permissions)
          # is not silently swallowed: only fall back to create-alias when the
          # alias genuinely does not exist yet. Mirrors cleanup pass-2's
          # ResourceNotFoundException handling.
          UPD_ERR=$(mktemp)
          if ! aws lambda update-alias \
            --function-name "$FUNCTION_NAME" \
            --name "$MOVING" \
            --function-version "$VERSION" \
            --region ${{ inputs.aws-region }} > /dev/null 2>"$UPD_ERR"; then
            if grep -q "ResourceNotFoundException" "$UPD_ERR"; then
              echo "Moving alias '${MOVING}' does not exist yet; creating it."
              aws lambda create-alias \
                --function-name "$FUNCTION_NAME" \
                --name "$MOVING" \
                --function-version "$VERSION" \
                --region ${{ inputs.aws-region }} > /dev/null
            else
              cat "$UPD_ERR" >&2
              rm -f "$UPD_ERR"
              exit 1
            fi
          fi
          rm -f "$UPD_ERR"
