# This workflow builds a Go Lambda binary and uploads it as a GHA artifact.
# It does NOT have AWS credentials and cannot deploy or push anything to AWS.
# The binary is deployed by a separate deploy-lambda.yml workflow.
#
# This separation ensures that code execution (go build) never has access
# to deployment credentials.
name: Build Lambda

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use for building"
        required: false
        type: string
        default: "1.18"
      build-dir:
        description: "Path to the Go package containing main, relative to working-directory (e.g. ./exec/http/lambda)"
        required: true
        type: string
      working-directory:
        description: "Directory containing the service Go module (its go.mod/go.sum), relative to the repository root (e.g. apps/api/spalk-live-sync-api for a monorepo caller). go mod download and go build run here, and build-dir resolves relative to it. Default '.' preserves the standalone-repo behaviour."
        required: false
        type: string
        default: "."
      binary-name:
        description: "Output binary name (use 'bootstrap' for provided.al2023 runtime, 'main' for go1.x)"
        required: false
        type: string
        default: "main"
      artifact-name:
        description: "Name for the binary handed to deploy-lambda.yml; keys its Actions cache entry (must be unique within the workflow run)"
        required: true
        type: string
      goarch:
        description: "Target architecture (amd64 or arm64)"
        required: false
        type: string
        default: "amd64"
      runner:
        description: "The type of runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      use-ssh:
        description: "Whether to use SSH for private repositories"
        required: false
        type: boolean
        default: false
    secrets:
      ssh-private-key:
        description: "SSH keys for accessing private Go module repositories."
        required: false
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact containing the Lambda binary"
        value: ${{ jobs.build-lambda.outputs.artifact-name }}
      binary-key:
        description: "S3 key of the binary; pass to deploy-lambda.yml's binary-key"
        value: ${{ jobs.build-lambda.outputs.binary-key }}
      binary-sha256:
        description: "sha256 of the binary; pass to deploy-lambda.yml's binary-sha256"
        value: ${{ jobs.build-lambda.outputs.binary-sha256 }}

jobs:
  build-lambda:
    name: Build Lambda
    runs-on: ${{ inputs.runner }}
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
      binary-key: ${{ steps.handoff.outputs.key }}
      binary-sha256: ${{ steps.handoff.outputs.sha256 }}
    env:
      GOPRIVATE: "github.com/SpalkLtd/*"
    steps:
      - if: ${{ startsWith(inputs.runner, 'runs-on=') }}
        uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          # Key the module cache on the service go.sum (with the default '.' this is
          # ./go.sum — unchanged for standalone callers).
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - run: go env -w GOPRIVATE="github.com/SpalkLtd/*"

      # Configure deploy SSH keys to download private repos.
      # Details: https://github.com/SpalkLtd/ssh-agent#support-for-github-deploy-keys
      - name: Allow access to Spalk private repositories
        if: ${{ inputs.use-ssh }}
        uses: SpalkLtd/ssh-agent@26e485b72da53538f103f191ddd325d2f2ef3771
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}

      - name: Download Go modules
        working-directory: ${{ inputs.working-directory }}
        run: go mod download

      - name: Build Lambda binary
        working-directory: ${{ inputs.working-directory }}
        env:
          GOOS: linux
          GOARCH: ${{ inputs.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o /tmp/${{ inputs.binary-name }} ${{ inputs.build-dir }}

      # One object in the RunsOn cache bucket, under this run and attempt. Any job
      # on the stack can overwrite it, so the consumer trusts the sha256 output
      # (job outputs are run-scoped), not the object. The instance role writes it:
      # credentials an earlier step exported are dropped for this command only.
      - name: Hand binary to the next job
        id: handoff
        env:
          KEY: ${{ env.RUNS_ON_S3_CACHE_REPO_PREFIX }}/handoff/${{ github.run_id }}/${{ github.run_attempt }}/${{ inputs.artifact-name }}
        run: |
          : "${RUNS_ON_S3_BUCKET_CACHE:?handoff needs a RunsOn runner with the s3-cache extra}"
          sha=$(sha256sum "/tmp/${{ inputs.binary-name }}" | cut -d' ' -f1)
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN -u AWS_PROFILE \
            aws s3 cp --only-show-errors --region "$RUNS_ON_AWS_REGION" "/tmp/${{ inputs.binary-name }}" "s3://$RUNS_ON_S3_BUCKET_CACHE/$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
